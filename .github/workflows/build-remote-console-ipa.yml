name: Build Filza-27 IPA with Remote Console

# Produces a sideloadable, unsigned Filza-27.ipa that contains the remote file
# viewer console:
#   * rebuilds FilzaApplySandboxExt.dylib from THIS tree (console module included)
#   * reuses the official Filza-27 release IPA as the unsigned base shell
#     (override with `base_ipa_url` if you have your own unsigned Filza shell)
#   * injects the dylib + FilzaRemoteWeb.bundle and uploads the IPA as an artifact
#
# With `chat_shell: true` the same pipeline emits the chat-first shell IPA: the
# app boots into the chat system (chat_shell_url), Filza's file manager UI is
# never shown, and every backend runtime keeps working over the wire. Packaging
# and rollback contract: docs/CHAT_SHELL.md
#
# Toolchain pins are identical to .github/workflows/diagnose-full-build.yml so a
# green run here means the same thing a green diagnose run means.
#
# NOTE for forks: GitHub disables Actions on forks. Open the Actions tab once and
# click "I understand my workflows, go ahead and enable them", otherwise the
# "Run workflow" button stays hidden.

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: 'Base unsigned Filza IPA URL (leave empty for the pinned Filza-27 release IPA)'
        required: false
        default: ''
      runner:
        description: 'Runner label (macos-26 = GitHub-hosted and free for public repos; macos-15-intel also works)'
        required: false
        default: 'macos-26'
      xcode_version:
        description: 'Xcode version installed by setup-xcode'
        required: false
        default: '26.2'
      create_release:
        description: 'Also publish a GitHub Release with the IPA'
        type: boolean
        default: false
      chat_shell:
        description: 'Build the chat-first shell IPA: home page is the chat system, Filza UI is never shown'
        type: boolean
        default: false
      chat_shell_url:
        description: 'Chat system URL used as the app home page (chat_shell only)'
        required: false
        default: 'https://trymaskcard.com/'
      chat_shell_display_name:
        description: 'Springboard name for the chat client (chat_shell only)'
        required: false
        default: 'TryMaskCard'

concurrency:
  group: build-remote-console-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca
      LIBSSH_COMMIT: 07430deb9b97b751ec5ea5a7fc307f40bf042e0a
      MBEDTLS_COMMIT: 068ff080b369adfac81509f9b57b2afabaf82dc5
      BASE_IPA_REPO: NightVibes33/Filza-27
      # Last-resort fallback only. The fetch step resolves the current release
      # asset through the GitHub API first, because a renamed or re-published
      # release silently 404s a hard-coded tag (that is exactly how the
      # Filza-27-byetunes-upstream pin broke).
      PINNED_BASE_IPA: https://github.com/NightVibes33/Filza-27/releases/download/Filza27-AirCard/Filza-27.ipa

    steps:
      - name: Runner diagnostics
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Xcode ${{ inputs.xcode_version }} setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Confirm the iOS SDK is usable
        run: |
          set -euxo pipefail
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $SDK"
          test -d "$SDK"

      - name: Checkout complete source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Procursus build tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make

      - name: Install host tools (trash, automake, libtool for the wolfSSH stack)
        run: |
          set -euxo pipefail
          brew install trash automake libtool || brew upgrade trash automake libtool || true
          command -v trash
          command -v automake

      - name: Verify the remote console bundle before the long build
        run: |
          set -euxo pipefail
          bash scripts/stage-remote-console-assets.sh
          bash scripts/stage-remote-console-assets.sh --check
          test -s Resources/FilzaRemoteWeb/FilzaRemoteWeb.bundle/index.html

      - name: Restore pinned Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}

      - name: Install pinned Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$THEOS"
          git clone --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive

      - name: Restore pinned idevice FFI cache
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: Vendor/idevice
          key: idevice-ffi-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-${{ hashFiles('scripts/build-idevice.sh') }}

      - name: Build pinned idevice FFI
        if: steps.idevice-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-idevice.sh "$GITHUB_WORKSPACE/Vendor/idevice"

      - name: Restore pinned SSH stack cache
        id: ssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/ssh
          key: ssh-stack-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.LIBSSH_COMMIT }}-${{ env.MBEDTLS_COMMIT }}-${{ hashFiles('scripts/build-ssh-stack.sh') }}

      - name: Build pinned SSH stack
        if: steps.ssh-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-ssh-stack.sh "$GITHUB_WORKSPACE/Vendor/ssh"

      # FilzaSSHMetadata.mk requires the wolfSSH/wolfSSL static libraries; the
      # diagnose workflow does not build them, so a release build would stop at
      # its before-* assertions without this step.
      - name: Restore pinned wolfSSH stack cache
        id: wolfssh-cache
        uses: actions/cache@v4
        with:
          path: Vendor/wolfssh
          key: wolfssh-stack-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ hashFiles('scripts/build-wolfssh-stack.sh', 'scripts/wolfssh-allow-multiple-session-channels.patch') }}

      - name: Build pinned wolfSSH stack
        if: steps.wolfssh-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-wolfssh-stack.sh "$GITHUB_WORKSPACE/Vendor/wolfssh"

      - name: Fetch the unsigned base IPA
        id: base
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}
          BASE_IPA_REPO: ${{ env.BASE_IPA_REPO }}
          PINNED_BASE_IPA: ${{ env.PINNED_BASE_IPA }}
        run: |
          set -euxo pipefail
          # Resolves the current release asset from the GitHub API, falls back to
          # the pinned URL, then validates the download (zip shape, single app,
          # MobileHouseArrest bundle id, MinimumOSVersion, unsigned) *before* the
          # long build. A bad base now fails here with a readable reason.
          bash scripts/fetch-base-ipa.sh base-filza.ipa "$BASE_IPA_URL"
          unzip -tq base-filza.ipa
          unzip -l base-filza.ipa | grep -F 'Payload/' | sed -n '1,5p'
          echo "base_ipa=$PWD/base-filza.ipa" >> "$GITHUB_OUTPUT"

      - name: Build the tweak and package the IPA
        id: package
        shell: bash
        env:
          FILZA_CHAT_SHELL: ${{ inputs.chat_shell && '1' || '0' }}
          FILZA_CHAT_SHELL_URL: ${{ inputs.chat_shell_url }}
          FILZA_CHAT_SHELL_DISPLAY_NAME: ${{ inputs.chat_shell_display_name }}
        run: |
          set +e
          export PATH="/opt/procursus/bin:$PATH"
          mkdir -p build-logs
          chmod +x scripts/build_release_ipa.sh scripts/build_chat_shell_ipa.sh
          OUT_IPA="Filza-27-remote-console.ipa"
          if [ "${FILZA_CHAT_SHELL}" = "1" ]; then
            OUT_IPA="TryMaskCard-chat-shell.ipa"
            echo "chat-first shell build: home=${FILZA_CHAT_SHELL_URL} name=${FILZA_CHAT_SHELL_DISPLAY_NAME}"
          fi
          echo "ipa=${OUT_IPA}" >> "$GITHUB_OUTPUT"
          set -o pipefail
          ./scripts/build_release_ipa.sh "${{ steps.base.outputs.base_ipa }}" "$OUT_IPA" 2>&1 | tee build-logs/package.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "===== BUILD TAIL ====="
          tail -n 200 build-logs/package.log || true

          # Surface the interesting lines on the run page, so a failure can be read
          # (and pasted) without downloading the log artifact.
          {
            echo "### Packaging exit code: ${rc}"
            echo ''
            echo '```text'
            grep -nE "error:|fatal error|clang: error|ld: |Undefined symbols|The following build commands failed|AssertionError|Missing |No such file" build-logs/package.log | tail -n 150 || true
            echo '--- tail ---'
            tail -n 80 build-logs/package.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          exit "$rc"

      - name: Verify the packaged IPA contains the console
        run: |
          set -euxo pipefail
          IPA="${{ steps.package.outputs.ipa }}"
          test -s "$IPA"
          unzip -tq "$IPA"
          listing="$(unzip -l "$IPA")"
          echo "$listing" | grep -F 'Frameworks/FilzaApplySandboxExt.dylib'
          echo "$listing" | grep -F 'FilzaRemoteWeb.bundle/index.html'
          echo "$listing" | grep -F 'FilzaRemoteWeb.bundle/js/app.js'
          echo "$listing" | grep -F 'FilzaRemoteWeb.bundle/assets/images/filetype-icon-sprite.svg'
          echo "$listing" | grep -F 'Filza3105.bundle/UpstreamAppInfo.plist'
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > /tmp/packaged-info.plist
          plutil -extract CFBundleIdentifier raw -o - /tmp/packaged-info.plist | tee /tmp/packaged-id.txt
          test "$(cat /tmp/packaged-id.txt)" = "com.apple.mobile.MobileHouseArrest"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          ls -l "$IPA"

      # Chat-first shell parity: the artifact must carry the shell plist, the
      # chat-client metadata and the compiled module inside the injected dylib.
      - name: Verify the chat-first shell packaging
        if: ${{ inputs.chat_shell }}
        run: |
          set -euxo pipefail
          IPA="${{ steps.package.outputs.ipa }}"
          python3 scripts/check-chat-shell-sources.py
          python3 scripts/merge-chat-shell-metadata.py --verify-ipa "$IPA" --scheme trymaskcard
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > /tmp/shell-info.plist
          unzip -p "$IPA" 'Payload/*.app/TryMaskCardShell.plist' > /tmp/shell-config.plist
          plutil -lint /tmp/shell-config.plist
          plutil -extract CFBundleDisplayName raw -o - /tmp/shell-info.plist
          plutil -extract homeURL raw -o - /tmp/shell-config.plist
          plutil -extract allowHiddenFileManager raw -o - /tmp/shell-config.plist

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: filza-27-ipa-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.ipa }}
            ${{ steps.package.outputs.ipa }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload the packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filza-remote-console-package-log-${{ github.run_id }}
          path: build-logs/package.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish a GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filza-27-ipa-${{ github.run_number }}
          name: Filza-27 IPA (${{ github.run_number }})
          body: |
            Unsigned IPA built from ${{ github.sha }}.

            Remote console build: enable it under Preferences -> REMOTE CONSOLE, then open the
            pairing link shown on the device from a browser on the same Wi-Fi.

            Chat-first shell build (chat_shell=true): the app boots into the chat system and
            Filza's file manager UI is never shown; manage files over the wire instead.
            Contract and rollback: docs/CHAT_SHELL.md
          files: |
            ${{ steps.package.outputs.ipa }}
            ${{ steps.package.outputs.ipa }}.sha256
